<svg width="450" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#343a40">Panic vs Result</text>
  
  <!-- Result Path -->
  <path d="M 50 100 L 200 100" stroke="#40c057" stroke-width="20" stroke-linecap="round"/>
  <text x="70" y="80" font-family="Arial" font-size="12" font-weight="bold" fill="#2f9e44">RESULT (Recoverable)</text>
  <path d="M 200 100 Q 225 100 225 125 T 250 150 L 400 150" stroke="#40c057" stroke-width="20" fill="none" stroke-linecap="round"/>
  <text x="280" y="130" font-family="Arial" font-size="11" fill="#2f9e44">Detour &amp; Continue</text>
  
  <!-- Panic Path -->
  <path d="M 50 180 L 200 180" stroke="#fa5252" stroke-width="20" stroke-linecap="round"/>
  <text x="70" y="215" font-family="Arial" font-size="12" font-weight="bold" fill="#e03131">PANIC (Fatal)</text>
  <rect x="200" y="165" width="20" height="30" fill="#e03131"/>
  <text x="230" y="185" font-family="Arial" font-size="20" font-weight="bold" fill="#e03131">💥 CRASH</text>
  
  <text x="240" y="40" font-family="Arial" font-size="12" fill="#868e96">"Pilihan yang tepat menyelamatkan program."</text>
</svg>
