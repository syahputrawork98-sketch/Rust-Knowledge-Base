<svg width="450" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#343a40">Monomorphization Logic</text>
  
  <!-- Generic -->
  <rect x="150" y="60" width="150" height="40" rx="5" fill="#adb5bd" stroke="#495057" stroke-width="2"/>
  <text x="185" y="85" font-family="Arial" font-size="14" font-weight="bold" fill="white">Struct Point&lt;T&gt;</text>
  
  <path d="M 180 100 L 100 160" stroke="#adb5bd" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 270 100 L 350 160" stroke="#adb5bd" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- i32 -->
  <rect x="30" y="160" width="140" height="60" rx="5" fill="#d0ebff" stroke="#228be6" stroke-width="2"/>
  <text x="50" y="185" font-family="Arial" font-size="12" font-weight="bold" fill="#1864ab">Point&lt;i32&gt;</text>
  <text x="50" y="205" font-family="Arial" font-size="12" fill="#1c7ed6">x: i32, y: i32</text>
  
  <!-- f64 -->
  <rect x="280" y="160" width="140" height="60" rx="5" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
  <text x="300" y="185" font-family="Arial" font-size="12" font-weight="bold" fill="#2b8a3e">Point&lt;f64&gt;</text>
  <text x="300" y="205" font-family="Arial" font-size="12" fill="#2f9e44">x: f64, y: f64</text>
  
  <text x="140" y="240" font-family="Arial" font-size="12" font-style="italic" fill="#868e96">Rust generates concrete code at compile time.</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#adb5bd" />
    </marker>
  </defs>
</svg>
