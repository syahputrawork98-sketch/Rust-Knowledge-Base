<svg width="450" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#343a40">Default vs Overridden Traits</text>
  
  <!-- Trait -->
  <rect x="50" y="60" width="350" height="40" rx="5" fill="#343a40"/>
  <text x="70" y="85" font-family="Arial" font-size="14" font-weight="bold" fill="white">trait Summary { fn summarize() { ... } }</text>
  
  <!-- Type A (Default) -->
  <rect x="50" y="130" width="150" height="80" rx="5" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="65" y="155" font-family="Arial" font-size="12" font-weight="bold" fill="#495057">impl Summary for A {}</text>
  <text x="65" y="185" font-family="Arial" font-size="12" fill="#2f9e44">✓ Use Default</text>
  
  <!-- Type B (Override) -->
  <rect x="250" y="130" width="150" height="80" rx="5" fill="#fff9db" stroke="#fcc419"/>
  <text x="260" y="155" font-family="Arial" font-size="12" font-weight="bold" fill="#343a40">impl Summary for B {</text>
  <text x="270" y="185" font-family="Arial" font-size="11" fill="#e03131">fn summarize() { override }</text>
  <text x="260" y="200" font-family="Arial" font-size="12" font-weight="bold" fill="#343a40">}</text>
  
  <path d="M 125 100 L 125 130" stroke="#adb5bd" stroke-width="1"/>
  <path d="M 325 100 L 325 130" stroke="#adb5bd" stroke-width="1"/>
</svg>
