<svg width="450" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#343a40">Trait Objects: Dynamic Dispatch</text>
  
  <!-- Pointer Box -->
  <rect x="50" y="80" width="120" height="80" rx="5" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="60" y="100" font-family="Arial" font-size="12" font-weight="bold" fill="#495057">Box&lt;dyn Speak&gt;</text>
  <line x1="60" y1="120" x2="160" y2="120" stroke="#adb5bd"/>
  <text x="60" y="140" font-family="Arial" font-size="10" fill="#1864ab">Ptr to Data</text>
  <text x="60" y="155" font-family="Arial" font-size="10" fill="#e03131">Ptr to VTable</text>
  
  <!-- Data -->
  <rect x="250" y="60" width="80" height="40" fill="#d0ebff" rx="5"/>
  <text x="265" y="85" font-family="Arial" font-size="12" fill="#1864ab">Data (Anjing)</text>
  
  <!-- VTable -->
  <rect x="250" y="130" width="150" height="100" rx="5" fill="#ffe3e3" stroke="#e03131"/>
  <text x="260" y="150" font-family="Arial" font-size="12" font-weight="bold" fill="#e03131">VTable (Speak)</text>
  <line x1="260" y1="165" x2="390" y2="165" stroke="#ffc9c9"/>
  <text x="265" y="185" font-family="Courier New" font-size="10">bunyi: &amp;ptr_anjing_bunyi</text>
  <text x="265" y="205" font-family="Courier New" font-size="10">pergi: &amp;ptr_anjing_pergi</text>
  
  <!-- Pointers -->
  <path d="M 170 140 L 240 80" stroke="#1864ab" stroke-width="1" stroke-dasharray="2" marker-end="url(#blue-arrow)"/>
  <path d="M 170 155 L 240 180" stroke="#e03131" stroke-width="1" stroke-dasharray="2" marker-end="url(#red-arrow)"/>
  
  <defs>
    <marker id="blue-arrow" markerWidth="5" markerHeight="5" refX="0" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L5,2.5 z" fill="#1864ab" />
    </marker>
    <marker id="red-arrow" markerWidth="5" markerHeight="5" refX="0" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L5,2.5 z" fill="#e03131" />
    </marker>
  </defs>
</svg>
