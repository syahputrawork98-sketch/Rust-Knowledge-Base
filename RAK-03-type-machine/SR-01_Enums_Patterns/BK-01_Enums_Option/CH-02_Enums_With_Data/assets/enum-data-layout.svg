<svg width="450" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#343a40">Memory Layout: Enum with Data</text>
  
  <!-- Byte layout -->
  <rect x="50" y="60" width="50" height="40" stroke="#343a40" fill="#ced4da" stroke-width="2"/>
  <text x="58" y="85" font-family="Arial" font-size="12" fill="#343a40">TAG</text>
  
  <rect x="100" y="60" width="300" height="40" stroke="#343a40" fill="#e9ecef" stroke-width="2"/>
  <text x="210" y="85" font-family="Arial" font-size="12" fill="#343a40">DATA (Largest Variant)</text>
  
  <text x="50" y="120" font-family="Arial" font-size="12" fill="#495057">0 = V4</text>
  <text x="50" y="135" font-family="Arial" font-size="12" fill="#495057">1 = V6</text>
  
  <path d="M 50 150 L 400 150" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4"/>
  <text x="160" y="170" font-family="Arial" font-size="12" font-style="italic" fill="#868e96">Safe and Efficient Union</text>
</svg>
