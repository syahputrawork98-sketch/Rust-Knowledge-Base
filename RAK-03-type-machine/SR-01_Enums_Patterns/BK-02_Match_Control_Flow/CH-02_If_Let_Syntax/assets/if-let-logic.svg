<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#343a40">If Let Shorthand</text>
  
  <!-- Data -->
  <circle cx="200" cy="50" r="10" fill="#339af0"/>
  
  <!-- Single Path -->
  <path d="M 200 60 L 200 100" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="125" y="100" width="150" height="40" rx="5" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
  <text x="145" y="125" font-family="Arial" font-size="12" font-weight="bold" fill="#2b8a3e">if let Some(x) = data</text>
  
  <!-- Else drop -->
  <path d="M 200 140 L 300 180" stroke="#dee2e6" stroke-width="1" stroke-dasharray="2"/>
  <text x="310" y="185" font-family="Arial" font-size="12" fill="#adb5bd">Ignore others</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#adb5bd" />
    </marker>
  </defs>
</svg>
