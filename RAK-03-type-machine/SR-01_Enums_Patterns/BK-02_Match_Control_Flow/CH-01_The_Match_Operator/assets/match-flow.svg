<svg width="450" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#343a40">Match Operator Flow</text>
  
  <!-- The Input -->
  <circle cx="225" cy="60" r="15" fill="#339af0"/>
  <text x="212" y="40" font-family="Arial" font-size="12" fill="#339af0">Data In</text>
  
  <!-- Sorting Logic -->
  <rect x="150" y="100" width="150" height="40" rx="5" fill="#adb5bd"/>
  <text x="185" y="125" font-family="Arial" font-size="14" font-weight="bold" fill="white">MATCH</text>
  
  <!-- Arms -->
  <path d="M 225 140 L 100 200" stroke="#adb5bd" fill="none" stroke-width="2"/>
  <path d="M 225 140 L 225 200" stroke="#adb5bd" fill="none" stroke-width="2"/>
  <path d="M 225 140 L 350 200" stroke="#adb5bd" fill="none" stroke-width="2"/>
  
  <rect x="60" y="200" width="80" height="30" rx="5" fill="#e03131"/>
  <text x="75" y="220" font-family="Arial" font-size="12" fill="white">Arm 1</text>
  
  <rect x="185" y="200" width="80" height="30" rx="5" fill="#fcc419"/>
  <text x="200" y="220" font-family="Arial" font-size="12" fill="#343a40">Arm 2</text>
  
  <rect x="310" y="200" width="80" height="30" rx="5" fill="#2f9e44"/>
  <text x="325" y="220" font-family="Arial" font-size="12" fill="white">Arm 3</text>
  
  <text x="360" y="130" font-family="Arial" font-size="12" fill="#e03131" font-weight="bold">Exhaustive!</text>
</svg>
