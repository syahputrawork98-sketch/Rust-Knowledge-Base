<svg width="450" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#343a40">Pattern Anatomy: Destructuring</text>
  
  <!-- Original Data -->
  <rect x="50" y="60" width="120" height="60" rx="5" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
  <text x="65" y="85" font-family="Arial" font-size="12" fill="#495057">Point { x: 10, y: 20 }</text>
  
  <path d="M 170 90 L 250 90" stroke="#339af0" stroke-width="3" marker-end="url(#blue-arrow)"/>
  
  <!-- Destructured -->
  <rect x="250" y="60" width="150" height="120" rx="5" fill="#d0ebff" stroke="#228be6" stroke-width="2"/>
  <text x="260" y="85" font-family="Arial" font-size="12" font-weight="bold" fill="#1864ab">let Point { x, y } = p;</text>
  
  <line x1="260" y1="100" x2="390" y2="100" stroke="#74c0fc" stroke-width="1"/>
  
  <text x="265" y="130" font-family="Arial" font-size="12" fill="#1c7ed6">x &lt;- 10</text>
  <text x="265" y="155" font-family="Arial" font-size="12" fill="#1c7ed6">y &lt;- 20</text>
  
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#339af0" />
    </marker>
  </defs>
</svg>
