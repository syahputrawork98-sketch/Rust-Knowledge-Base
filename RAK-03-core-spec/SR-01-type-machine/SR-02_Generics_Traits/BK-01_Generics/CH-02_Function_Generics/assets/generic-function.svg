<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#343a40">Generic Function Map</text>
  
  <!-- Inputs -->
  <circle cx="50" cy="80" r="10" fill="#339af0"/>
  <text x="40" y="105" font-family="Arial" font-size="10" fill="#339af0">i32</text>
  
  <circle cx="50" cy="130" r="10" fill="#228be6"/>
  <text x="40" y="155" font-family="Arial" font-size="10" fill="#228be6">f64</text>
  
  <!-- Function -->
  <rect x="150" y="70" width="100" height="80" rx="10" fill="#f1f3f5" stroke="#343a40" stroke-width="2"/>
  <text x="175" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#343a40">fn&lt;T&gt;</text>
  
  <path d="M 65 80 L 140 100" stroke="#adb5bd" stroke-width="1"/>
  <path d="M 65 130 L 140 120" stroke="#adb5bd" stroke-width="1"/>
  
  <!-- Output -->
  <path d="M 260 110 L 330 110" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="90" width="40" height="40" rx="5" fill="#40c057"/>
  <text x="352" y="115" font-family="Arial" font-size="12" font-weight="bold" fill="white">Ok!</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#adb5bd" />
    </marker>
  </defs>
</svg>
