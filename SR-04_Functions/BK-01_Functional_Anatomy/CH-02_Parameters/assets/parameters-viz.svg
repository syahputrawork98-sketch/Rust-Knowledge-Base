<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Aliran Argumen ke Parameter</text>

  <!-- Caller Section -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="160" height="80" rx="5" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="80" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#1b5e20">Panggilan (Main)</text>
    <text x="80" y="55" text-anchor="middle" font-family="Courier New" font-size="12" font-weight="bold">cetak("Hai", 5)</text>
  </g>

  <!-- Function Definition Section -->
  <g transform="translate(290, 60)">
    <rect x="0" y="0" width="160" height="80" rx="5" fill="#e3f2fd" stroke="#1565c0" />
    <text x="80" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#0d47a1">Definisi (fn)</text>
    <text x="80" y="55" text-anchor="middle" font-family="Courier New" font-size="11" font-weight="bold">fn cetak(s: &str, n: i32)</text>
  </g>

  <!-- Flows -->
  <!-- Argument 1 to Param 1 -->
  <path d="M 120 75 C 150 110, 260 110, 310 75" stroke="#f66" stroke-width="2" fill="none" marker-end="url(#arrow-red)" />
  <text x="215" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#c62828">Argumen &quot;Hai&quot; -> Parameter s</text>

  <!-- Argument 2 to Param 2 -->
  <path d="M 150 75 C 180 140, 330 140, 350 75" stroke="#4db6ac" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  <text x="250" y="155" text-anchor="middle" font-family="Arial" font-size="9" fill="#00695c">Argumen 5 -> Parameter n</text>

  <defs>
    <marker id="arrow-red" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f66" />
    </marker>
    <marker id="arrow-green" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4db6ac" />
    </marker>
  </defs>
</svg>
