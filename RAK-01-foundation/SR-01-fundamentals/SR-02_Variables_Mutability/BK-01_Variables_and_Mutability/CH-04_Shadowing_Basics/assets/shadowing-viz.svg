<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Shadowing: Layering Identitas</text>

  <!-- Base Variable -->
  <g transform="translate(150, 60)">
    <rect x="0" y="0" width="200" height="40" rx="5" fill="#eeeeee" stroke="#999" />
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">let x = "lima"; (String)</text>
    <text x="100" y="-5" text-anchor="middle" font-family="Arial" font-size="8" fill="#999">Variabel Pertama</text>
  </g>

  <!-- Shadow Process -->
  <path d="M 250 100 L 250 130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="260" y="120" font-family="Arial" font-size="9" font-weight="bold">let x = x.len();</text>

  <!-- The "Shadow" (New Variable) -->
  <g transform="translate(130, 140)">
    <rect x="0" y="0" width="240" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" />
    <text x="120" y="35" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">let x = 4; (Integer)</text>
    <text x="120" y="52" text-anchor="middle" font-family="Arial" font-size="9" fill="#1565c0">"x" lama tertutup bayangan</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
