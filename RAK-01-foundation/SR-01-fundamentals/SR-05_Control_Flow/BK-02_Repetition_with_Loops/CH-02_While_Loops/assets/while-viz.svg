<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <!-- Background -->
  <rect x="0" y="0" width="500" height="300" rx="15" fill="#ffffff" />
  <rect x="10" y="10" width="480" height="280" rx="12" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- Title -->
  <text x="250" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Logika Perulangan 'while'</text>

  <!-- Flow Path -->
  <path d="M 250 60 L 250 100" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrow-gray)" />
  
  <!-- Condition Diamond -->
  <g transform="translate(250, 130)">
    <path d="M 0 -35 L 60 0 L 0 35 L -60 0 Z" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#f57f17">Kondisi?</text>
  </g>

  <!-- True Flow (To Loop Body) -->
  <path d="M 190 130 L 100 130 L 100 210" fill="none" stroke="#4caf50" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="145" y="125" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#2e7d32">true</text>

  <!-- Loop Body -->
  <g transform="translate(45, 210)">
    <rect x="0" y="0" width="110" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
    <text x="55" y="30" text-anchor="middle" font-family="Consolas" font-size="10" fill="#1b5e20">{ Body }</text>
  </g>

  <!-- Return Flow -->
  <path d="M 45 235 L 20 235 L 20 80 L 250 80" fill="none" stroke="#4caf50" stroke-width="2" />
  <text x="35" y="150" text-anchor="start" font-family="Segoe UI" font-size="9" fill="#2e7d32" opacity="0.7">Ulangi Cek</text>

  <!-- False Flow (To Exit) -->
  <path d="M 310 130 L 400 130 L 400 230" fill="none" stroke="#f44336" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <text x="355" y="125" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#c62828">false</text>

  <!-- Exit Block -->
  <text x="400" y="255" text-anchor="middle" font-family="Segoe UI" font-size="11" font-weight="bold" fill="#b71c1c">KELUAR</text>

  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4caf50" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f44336" />
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9e9e9e" />
    </marker>
  </defs>
</svg>
