<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Unicode Scalar: Tipe char (4 Byte)</text>

  <!-- Slot Unicode -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="400" height="80" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
    <text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="10" fill="#e65100">Kapasitas 4 Byte (32-bit)</text>
    
    <!-- Content A -->
    <rect x="30" y="40" width="40" height="30" rx="3" fill="white" stroke="#ef6c00" />
    <text x="50" y="60" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">'A'</text>

    <!-- Content Kanji -->
    <rect x="120" y="40" width="40" height="30" rx="3" fill="white" stroke="#ef6c00" />
    <text x="140" y="60" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">'中'</text>

    <!-- Content Emoji -->
    <rect x="210" y="40" width="40" height="30" rx="3" fill="white" stroke="#ef6c00" />
    <text x="230" y="60" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">'😻'</text>

    <text x="320" y="60" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic" fill="#999">...dan jutaan lainnya</text>
  </g>

  <rect x="50" y="160" width="400" height="50" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-dasharray="5,5" />
  <text x="250" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="#1b5e20" font-weight="bold">PENANDA TIPE</text>
  <text x="250" y="200" text-anchor="middle" font-family="Arial" font-size="9" fill="#1b5e20">Wajib menggunakan kutip tunggal (' ') untuk char.</text>
</svg>
