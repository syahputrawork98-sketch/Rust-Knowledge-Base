<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Visualisasi Kapasitas Integer</text>

  <!-- u8 box -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="80" height="40" rx="5" fill="#e3f2fd" stroke="#1565c0" />
    <text x="40" y="20" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">u8</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial" font-size="8">0 - 255</text>
  </g>

  <!-- u16 box -->
  <g transform="translate(140, 60)">
    <rect x="0" y="0" width="100" height="50" rx="5" fill="#bbdefb" stroke="#1565c0" />
    <text x="50" y="20" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">u16</text>
    <text x="50" y="40" text-anchor="middle" font-family="Arial" font-size="8">0 - 65 Ribu</text>
  </g>

  <!-- u32 box -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="150" height="70" rx="5" fill="#90caf9" stroke="#1565c0" />
    <text x="75" y="35" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">u32</text>
    <text x="75" y="55" text-anchor="middle" font-family="Arial" font-size="10">0 - 4 Miliar</text>
  </g>

  <rect x="50" y="150" width="400" height="50" rx="5" fill="#fff9c4" stroke="#fbc02d" stroke-dasharray="5,5" />
  <text x="250" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#f57f17" font-weight="bold">ARCH (isize / usize)</text>
  <text x="250" y="190" text-anchor="middle" font-family="Arial" font-size="9" fill="#f57f17">Menyesuaikan dengan mode komputer (32-bit atau 64-bit)</text>
</svg>
