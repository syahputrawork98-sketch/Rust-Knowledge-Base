<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <rect x="10" y="10" width="480" height="180" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Visualisasi Array Slice (&amp;[T])</text>

  <rect x="30" y="70" width="440" height="50" rx="5" fill="#f5f5f5" stroke="#9e9e9e" />
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="40" height="40" stroke="#333" fill="#bbf" /> <text x="20" y="25" text-anchor="middle">1</text>
    <rect x="40" y="0" width="40" height="40" stroke="#333" fill="#e1f5fe" /> <text x="60" y="25" text-anchor="middle">2</text>
    <rect x="80" y="0" width="40" height="40" stroke="#333" fill="#e1f5fe" /> <text x="100" y="25" text-anchor="middle">3</text>
    <rect x="120" y="0" width="40" height="40" stroke="#333" fill="#bbf" /> <text x="140" y="25" text-anchor="middle">4</text>
    <rect x="160" y="0" width="40" height="40" stroke="#333" fill="#bbf" /> <text x="180" y="25" text-anchor="middle">5</text>
  </g>
  <text x="50" y="135" font-family="Arial" font-size="9" fill="#616161">Array Asli (Data di Stack)</text>

  <rect x="70" y="150" width="100" height="35" rx="5" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" />
  <text x="120" y="165" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Slice r: &amp;[i32]</text>
  <text x="120" y="180" text-anchor="middle" font-family="Arial" font-size="8" fill="#f57f17">(ptr to [1], len:2)</text>

  <path d="M 120 150 L 100 115" stroke="#fbc02d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
