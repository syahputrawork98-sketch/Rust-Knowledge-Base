<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <rect x="10" y="10" width="480" height="180" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Garis Waktu 'static Lifetime</text>

  <rect x="30" y="60" width="440" height="20" rx="10" fill="#eee" stroke="#999" />
  <text x="50" y="73" font-family="Arial" font-size="9" fill="#666">START (main)</text>
  <text x="430" y="73" text-anchor="end" font-family="Arial" font-size="9" fill="#666">END (exit)</text>

  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="440" height="40" rx="5" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" />
    <text x="220" y="25" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#f57f17">♾️ 'static (Seluruh Durasi Program)</text>
  </g>

  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="100" height="20" rx="3" fill="#e1f5fe" stroke="#01579b" />
    <text x="50" y="13" text-anchor="middle" font-family="Arial" font-size="9">'a (Scope Lokal)</text>
  </g>

  <text x="250" y="185" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Lokal bisa saja berakhir, tapi 'static tetap melaju.</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
