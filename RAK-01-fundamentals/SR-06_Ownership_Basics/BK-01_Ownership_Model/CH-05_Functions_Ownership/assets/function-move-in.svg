<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <rect x="10" y="10" width="480" height="180" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Masuk ke Fungsi (Delegasi)</text>

  <rect x="30" y="50" width="160" height="120" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-dasharray="5,5" />
  <text x="110" y="70" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Main Scope</text>
  <rect x="50" y="90" width="120" height="40" rx="5" fill="#f96" stroke="#333" />
  <text x="110" y="115" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">👤 s: 'proposal'</text>

  <path d="M 190 110 L 290 110" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="240" y="105" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">MOVE</text>

  <rect x="300" y="50" width="160" height="120" rx="5" fill="#e8eaf6" stroke="#1a237e" stroke-dasharray="5,5" />
  <text x="380" y="70" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Func Scope</text>
  <rect x="320" y="90" width="120" height="40" rx="5" fill="#f96" stroke="#333" />
  <text x="380" y="115" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">👤 teks</text>
  
  <path d="M 380 130 L 380 150" stroke="#f66" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="380" y="165" text-anchor="middle" font-family="Arial" font-size="9" fill="#f66" font-weight="bold">🔥 DROP</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
