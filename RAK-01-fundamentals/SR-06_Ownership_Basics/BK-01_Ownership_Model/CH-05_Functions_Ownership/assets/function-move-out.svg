<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150">
  <rect x="10" y="10" width="480" height="130" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Keluar dari Fungsi (Pengembalian)</text>

  <rect x="40" y="50" width="140" height="70" rx="5" fill="#e8eaf6" stroke="#1a237e" stroke-dasharray="5,5" />
  <text x="110" y="65" text-anchor="middle" font-family="Arial" font-size="11">Sisi Fungsi</text>
  <rect x="60" y="75" width="100" height="30" rx="5" fill="#f96" stroke="#333" />
  <text x="110" y="94" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">👤 teks</text>

  <path d="M 180 90 L 300 90" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="240" y="85" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">RETURN (MOVE)</text>

  <rect x="310" y="50" width="150" height="70" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-dasharray="5,5" />
  <text x="385" y="65" text-anchor="middle" font-family="Arial" font-size="11">Sisi Main</text>
  <rect x="330" y="75" width="110" height="30" rx="5" fill="#9f9" stroke="#333" stroke-width="2" />
  <text x="385" y="94" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">👑 s2: PEMILIK</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
