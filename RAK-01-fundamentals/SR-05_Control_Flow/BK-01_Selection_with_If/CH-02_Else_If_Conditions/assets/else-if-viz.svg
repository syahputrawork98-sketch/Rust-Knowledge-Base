<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350">
  <!-- Background -->
  <rect x="0" y="0" width="500" height="350" rx="15" fill="#ffffff" />
  <rect x="10" y="10" width="480" height="330" rx="12" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- Title -->
  <text x="250" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Visualisasi Else If (Rantai Keputusan)</text>

  <!-- Flow Line -->
  <path d="M 120 70 L 120 300" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="5,5" fill="none" />

  <!-- Decision 1 -->
  <g transform="translate(120, 80)">
    <path d="M 0 -20 L 30 0 L 0 20 L -30 0 Z" fill="#fff9c4" stroke="#fbc02d" stroke-width="1.5" />
    <path d="M 30 0 L 80 0" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow-green)" />
    <rect x="80" y="-15" width="100" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="130" y="5" text-anchor="middle" font-family="Consolas" font-size="9" fill="#1b5e20">Blok If</text>
    <text x="-40" y="5" text-anchor="end" font-family="Segoe UI" font-size="9" fill="#666">Kondisi 1</text>
  </g>

  <!-- Decision 2 -->
  <g transform="translate(120, 150)">
    <path d="M 0 -20 L 30 0 L 0 20 L -30 0 Z" fill="#fff9c4" stroke="#fbc02d" stroke-width="1.5" />
    <path d="M 30 0 L 80 0" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow-green)" />
    <rect x="80" y="-15" width="100" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="130" y="5" text-anchor="middle" font-family="Consolas" font-size="9" fill="#1b5e20">Blok Else If 1</text>
    <text x="-40" y="5" text-anchor="end" font-family="Segoe UI" font-size="9" fill="#666">Kondisi 2</text>
  </g>

  <!-- Decision 3 -->
  <g transform="translate(120, 220)">
    <path d="M 0 -20 L 30 0 L 0 20 L -30 0 Z" fill="#fff9c4" stroke="#fbc02d" stroke-width="1.5" />
    <path d="M 30 0 L 80 0" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow-green)" />
    <rect x="80" y="-15" width="100" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="130" y="5" text-anchor="middle" font-family="Consolas" font-size="9" fill="#1b5e20">Blok Else If 2</text>
    <text x="-40" y="5" text-anchor="end" font-family="Segoe UI" font-size="9" fill="#666">Kondisi 3</text>
  </g>

  <!-- Default Path -->
  <g transform="translate(120, 290)">
    <circle cx="0" cy="0" r="5" fill="#f44336" />
    <path d="M 5 0 L 80 0" stroke="#f44336" stroke-width="2" marker-end="url(#arrow-red)" />
    <rect x="80" y="-15" width="100" height="30" rx="4" fill="#ffebee" stroke="#c62828" />
    <text x="130" y="5" text-anchor="middle" font-family="Consolas" font-size="9" fill="#b71c1c">Blok Else</text>
    <text x="-40" y="5" text-anchor="end" font-family="Segoe UI" font-size="9" fill="#666">Lainnya</text>
  </g>

  <!-- Legend -->
  <rect x="300" y="100" width="170" height="150" rx="10" fill="#ffffff" stroke="#eeeeee" stroke-width="1" />
  <text x="315" y="125" font-family="Segoe UI" font-size="11" font-weight="bold" fill="#333">Aturan Rantai:</text>
  <text x="315" y="145" font-family="Segoe UI" font-size="10" fill="#666">1. Diperiksa dari ATAS.</text>
  <text x="315" y="165" font-family="Segoe UI" font-size="10" fill="#666">2. Berhenti di 'true' PERTAMA.</text>
  <text x="315" y="185" font-family="Segoe UI" font-size="10" fill="#666">3. Sisa rantai DIABAIKAN.</text>

  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4caf50" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f44336" />
    </marker>
  </defs>
</svg>
