<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <!-- Background -->
  <rect x="0" y="0" width="500" height="300" rx="15" fill="#ffffff" />
  <rect x="10" y="10" width="480" height="280" rx="12" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- Title -->
  <text x="250" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Visualisasi Keyword 'loop'</text>

  <!-- Loop Circle -->
  <g transform="translate(250, 150)">
    <!-- Main Path -->
    <path d="M 0 -80 A 80 80 0 1 1 0 80 A 80 80 0 1 1 0 -80" fill="none" stroke="#263238" stroke-width="4" stroke-dasharray="8,4" />
    
    <!-- Code Box -->
    <rect x="-60" y="-30" width="120" height="60" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" />
    <text x="0" y="-5" text-anchor="middle" font-family="Consolas" font-size="12" font-weight="bold" fill="#01579b">{ Blok Loop }</text>
    <text x="0" y="15" text-anchor="middle" font-family="Segoe UI" font-size="9" fill="#0277bd">Eksekusi Berulang</text>

    <!-- Break Point -->
    <g transform="translate(80, 0)">
      <circle cx="0" cy="0" r="15" fill="#ffebee" stroke="#f44336" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#c62828">!</text>
      <text x="35" y="5" text-anchor="start" font-family="Consolas" font-size="11" font-weight="bold" fill="#c62828">break</text>
    </g>

    <!-- Exit Path -->
    <path d="M 80 0 L 150 0" fill="none" stroke="#f44336" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <text x="180" y="5" text-anchor="middle" font-family="Segoe UI" font-size="10" fill="#f44336">KELUAR</text>

    <!-- Entry Point -->
    <path d="M 0 -130 L 0 -80" fill="none" stroke="#4caf50" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <text x="0" y="-140" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#2e7d32">Mulai</text>
  </g>

  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f44336" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4caf50" />
    </marker>
  </defs>
</svg>
