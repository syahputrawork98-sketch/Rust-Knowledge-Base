<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <rect x="10" y="10" width="480" height="180" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Izin Perubahan dengan 'mut'</text>

  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="120" height="60" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
    <text x="60" y="25" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">let mut x = 5;</text>
    <rect x="25" y="35" width="70" height="15" rx="3" fill="#2e7d32" />
    <text x="60" y="46" text-anchor="middle" font-family="Arial" font-size="8" fill="white">🔓 MUTABLE</text>
  </g>

  <path d="M 170 90 L 230 90" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="200" y="80" text-anchor="middle" font-family="Arial" font-size="9">Ubah Nilai</text>

  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="160" height="60" rx="5" fill="#fff3e0" stroke="#ef6c00" />
    <text x="80" y="25" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">x = 10;</text>
    <text x="80" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#e65100">✅ COMPILER APPROVE</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
