<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">IDE Feedback Loop</text>

  <circle cx="80" cy="120" r="30" fill="#eee" stroke="#333" />
  <text x="80" y="125" text-anchor="middle" font-family="Arial" font-size="10">Coding</text>

  <rect x="160" y="90" width="100" height="60" rx="5" fill="#e8eaf6" stroke="#1a237e" />
  <text x="210" y="125" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">VS Code</text>

  <path d="M 260 110 L 320 110" stroke="#333" stroke-width="2" marker-end="url(#doublearrow)" />
  <text x="290" y="100" text-anchor="middle" font-family="Arial" font-size="8">LSP</text>

  <rect x="320" y="90" width="120" height="60" rx="10" fill="#f96" stroke="#333" />
  <text x="380" y="125" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">rust-analyzer</text>

  <path d="M 380 150 L 380 180 C 380 220, 150 220, 80 150" stroke="#0f0" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="230" y="210" text-anchor="middle" font-family="Arial" font-size="9" fill="#2e7d32">Real-time Hints &amp; Errors</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="doublearrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 0 5 L 10 10" fill="none" stroke="#333" stroke-width="1" />
    </marker>
  </defs>
</svg>
