<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <rect x="10" y="10" width="480" height="280" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Hubungan Developer, Cargo, &amp; Compiler</text>

  <rect x="190" y="50" width="120" height="40" rx="20" fill="#eee" stroke="#333" />
  <text x="250" y="75" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">👤 Developer</text>

  <path d="M 250 90 L 250 110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="260" y="105" font-family="Arial" font-size="8">cargo build</text>

  <rect x="150" y="110" width="200" height="60" rx="10" fill="#f96" stroke="#333" />
  <text x="250" y="145" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">📦 CARGO (The Manager)</text>

  <path d="M 250 170 L 250 190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="170" y="190" width="160" height="50" rx="5" fill="#bbf" stroke="#333" />
  <text x="250" y="220" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">⚙️ rustc (The Compiler)</text>

  <path d="M 330 215 L 360 215" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="360" y="195" width="100" height="40" rx="5" fill="#9f9" stroke="#333" />
  <text x="410" y="220" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">📦 Executable</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
