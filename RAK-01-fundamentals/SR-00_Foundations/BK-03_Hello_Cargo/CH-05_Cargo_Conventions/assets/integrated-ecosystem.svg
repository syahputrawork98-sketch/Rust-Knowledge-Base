<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Ekosistem yang Terintegrasi</text>

  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="80" height="40" rx="5" fill="#f5f5f5" stroke="#333" />
    <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="8">Jakarta</text>
  </g>

  <g transform="translate(210, 60)">
    <rect x="0" y="0" width="80" height="40" rx="5" fill="#f5f5f5" stroke="#333" />
    <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="8">Tokyo</text>
  </g>

  <g transform="translate(370, 60)">
    <rect x="0" y="0" width="80" height="40" rx="5" fill="#f5f5f5" stroke="#333" />
    <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="8">Berlin</text>
  </g>

  <rect x="150" y="125" width="200" height="40" rx="5" fill="#f96" stroke="#333" />
  <text x="250" y="150" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">📦 Repositori Crates.io</text>

  <path d="M 90 100 L 250 125" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 250 100 L 250 125" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 410 100 L 250 125" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="175" y="195" width="150" height="40" rx="10" fill="#9f9" stroke="#1b5e20" stroke-width="3" />
  <text x="250" y="220" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">🚀 Proyek Anda</text>

  <path d="M 250 165 L 250 195" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
