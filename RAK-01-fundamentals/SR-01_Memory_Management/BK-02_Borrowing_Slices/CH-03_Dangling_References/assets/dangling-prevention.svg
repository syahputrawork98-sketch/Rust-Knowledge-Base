<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Mekanisme Pencegahan Dangling Reference</text>

  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="180" height="150" rx="5" fill="#f5f5f5" stroke="#9e9e9e" stroke-dasharray="2,2" />
    <text x="90" y="20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#616161">Fungsi: buat_dangling</text>
    
    <rect x="20" y="40" width="140" height="40" rx="5" fill="#f96" stroke="#333" />
    <text x="90" y="65" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">s: Sang Pemilik</text>

    <rect x="20" y="100" width="140" height="35" rx="5" fill="#f66" stroke="#333" />
    <text x="90" y="122" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">🔥 DROP at end</text>
  </g>

  <rect x="300" y="90" width="140" height="40" rx="5" fill="#eee" stroke="#f44336" stroke-width="2" />
  <text x="370" y="115" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#d32f2f">REFERENSI: &amp;s</text>

  <path d="M 170 110 L 300 110" stroke="#f44336" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <g transform="translate(280, 160)">
    <rect x="0" y="0" width="180" height="50" rx="5" fill="#ffebee" stroke="#c62828" />
    <text x="90" y="20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#b71c1c">BLOCKED BY COMPILER</text>
    <text x="90" y="40" text-anchor="middle" font-family="Arial" font-size="9" fill="#c62828">"Data mati sebelum dipinjam selesai"</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f44336" />
    </marker>
  </defs>
</svg>
