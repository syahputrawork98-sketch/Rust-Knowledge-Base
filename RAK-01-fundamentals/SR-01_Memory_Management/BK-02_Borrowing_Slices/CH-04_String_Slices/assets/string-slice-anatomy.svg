<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Anatomi String Slice (&amp;str) di Memori</text>

  <rect x="30" y="60" width="120" height="150" rx="5" fill="#e1f5fe" stroke="#01579b" stroke-dasharray="5,5" />
  <text x="90" y="80" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Stack</text>
  
  <rect x="40" y="90" width="100" height="50" rx="3" fill="#f96" stroke="#333" />
  <text x="90" y="105" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">s: String</text>
  <text x="90" y="125" text-anchor="middle" font-family="Arial" font-size="8">(ptr, len, cap)</text>

  <rect x="40" y="150" width="100" height="50" rx="3" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" />
  <text x="90" y="165" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">world: &amp;str</text>
  <text x="90" y="185" text-anchor="middle" font-family="Arial" font-size="8" fill="#f57f17">(ptr+6, len:5)</text>

  <rect x="250" y="90" width="200" height="40" rx="5" fill="#bbf" stroke="#333" />
  <text x="350" y="115" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" letter-spacing="5">h e l l o _ w o r l d</text>
  <text x="350" y="140" text-anchor="middle" font-family="Arial" font-size="9">(Heap Memory)</text>

  <path d="M 140 115 L 250 115" stroke="#f96" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 140 175 C 200 175, 300 130, 370 115" stroke="#fbc02d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="250" y="165" text-anchor="middle" font-family="Arial" font-size="9" fill="#f57f17">Menembak ke tengah data</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
