<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Perbandingan Rentang Hidup (Lifetimes)</text>

  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="400" height="30" rx="5" fill="#e1f5fe" stroke="#01579b" />
    <text x="10" y="20" font-family="Arial" font-size="11" font-weight="bold">Lifetime 'a (Variabel Referensi)</text>
    <path d="M 390 15 L 410 15" stroke="#333" stroke-dasharray="2,2" />
  </g>

  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="200" height="30" rx="5" fill="#f96" stroke="#333" />
    <text x="10" y="20" font-family="Arial" font-size="11" font-weight="bold">Lifetime 'b (Data Asli)</text>
    <text x="210" y="20" font-family="Arial" font-size="10" fill="#f44336">🔥 Drop di sini</text>
  </g>

  <path d="M 300 140 L 300 180" stroke="#f44336" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <g transform="translate(250, 190)">
    <rect x="0" y="0" width="200" height="40" rx="5" fill="#ffebee" stroke="#c62828" />
    <text x="100" y="15" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#b71c1c">ERROR: Dangling!</text>
    <text x="100" y="32" text-anchor="middle" font-family="Arial" font-size="9" fill="#c62828">Referensi 'a hidup lebih lama dari 'b</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f44336" />
    </marker>
  </defs>
</svg>
