  <rect x="30" y="60" width="100" height="40" rx="5" fill="#eee" stroke="#333" />
  <text x="80" y="85" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">📄 main.rs</text>

  <path d="M 130 80 L 170 80" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="170" y="60" width="120" height="40" rx="5" fill="#bbf" stroke="#333" />
  <text x="230" y="85" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">⚙️ rustc</text>

  <path d="M 230 100 L 230 130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <polygon points="230,130 300,160 230,190 160,160" fill="#fff" stroke="#333" />
  <text x="230" y="165" text-anchor="middle" font-family="Arial" font-size="8">Lulus Cek?</text>

  <path d="M 300 160 L 350 160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="350" y="140" width="120" height="40" rx="5" fill="#f96" stroke="#333" />
