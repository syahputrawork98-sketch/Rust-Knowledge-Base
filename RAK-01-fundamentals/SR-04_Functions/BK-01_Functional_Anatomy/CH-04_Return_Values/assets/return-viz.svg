<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Anatomi Nilai Balik (Return Values)</text>

  <!-- Function Box -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="300" height="120" rx="10" fill="#263238" stroke="#333" />
    
    <!-- Function Sig -->
    <text x="20" y="40" font-family="Courier New" font-size="14" fill="#ffcc80">fn tambah(x: i32)</text>
    <text x="165" y="40" font-family="Courier New" font-size="14" fill="#f06292"> -> i32 </text>
    <text x="230" y="40" font-family="Courier New" font-size="14" fill="#fff">{</text>
    
    <!-- Body -->
    <text x="40" y="80" font-family="Courier New" font-size="14" fill="#81d4fa">    x + 1</text>
    <path d="M 90 85 L 340 120" stroke="#f06292" stroke-width="1" stroke-dasharray="4" fill="none" opacity="0.5" />
    
    <text x="20" y="110" font-family="Courier New" font-size="14" fill="#fff">}</text>
  </g>

  <!-- Labels -->
  <path d="M 285 50 L 285 42" stroke="#f06292" stroke-width="2" marker-end="url(#arrow-pink)" />
  <text x="285" y="200" text-anchor="middle" font-family="Arial" font-size="10" fill="#ad1457">Deklarasi Tipe Output</text>

  <path d="M 160 180 L 160 160" stroke="#81d4fa" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="160" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#01579b">Ekspresi Akhir (Tanpa ";")</text>

  <text x="250" y="235" text-anchor="middle" font-family="Arial" font-size="9" fill="#999">"Keluaran fungsi mengalir melalui restu tanda panah ->"</text>

  <defs>
    <marker id="arrow-pink" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f06292" />
    </marker>
    <marker id="arrow-blue" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#81d4fa" />
    </marker>
  </defs>
</svg>
