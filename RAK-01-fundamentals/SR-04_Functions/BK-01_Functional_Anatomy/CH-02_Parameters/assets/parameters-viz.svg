<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280">
  <!-- Background -->
  <rect x="0" y="0" width="500" height="280" rx="15" fill="#ffffff" />
  <rect x="10" y="10" width="480" height="260" rx="12" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- Title -->
  <text x="250" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Aliran Argumen ke Parameter</text>
  <text x="250" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">(Proses Passing Data ke Fungsi)</text>

  <!-- Caller Section -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
    <rect x="0" y="0" width="180" height="30" rx="8" fill="#2e7d32" />
    <text x="90" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Panggilan (Caller)</text>
    
    <!-- Code Highlight -->
    <text x="90" y="65" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold">
      <tspan fill="#333">cetak(</tspan>
      <tspan id="arg1" fill="#c62828">"Hai"</tspan>
      <tspan fill="#333">, </tspan>
      <tspan id="arg2" fill="#1565c0">5</tspan>
      <tspan fill="#333">)</tspan>
    </text>
    <text x="90" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2e7d32" font-style="italic">Argumen Nyata</text>
  </g>

  <!-- Function Definition Section -->
  <g transform="translate(280, 90)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
    <rect x="0" y="0" width="180" height="30" rx="8" fill="#1565c0" />
    <text x="90" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Definisi (fn)</text>
    
    <!-- Code Highlight -->
    <text x="90" y="65" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="bold">
      <tspan fill="#333">fn cetak(</tspan>
      <tspan id="param1" fill="#c62828">s</tspan>
      <tspan fill="#333">, </tspan>
      <tspan id="param2" fill="#1565c0">n</tspan>
      <tspan fill="#333">)</tspan>
    </text>
    <text x="90" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1565c0" font-style="italic">Parameter (Wajib Tipe)</text>
  </g>

  <!-- Flows (Arrows) -->
  <!-- Flow 1: Arg 1 -> Param 1 -->
  <path d="M 125 155 Q 250 200, 315 155" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="4,2" marker-end="url(#arrow-red)" />
  
  <!-- Flow 2: Arg 2 -> Param 2 -->
  <path d="M 155 155 Q 250 240, 345 155" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-blue)" />

  <!-- Legend / Info -->
  <text x="250" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#888">"Nilai disalin atau dipindahkan ke variabel lokal fungsi"</text>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0" />
    </marker>
  </defs>
</svg>
