<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Statement vs Expression</text>

  <!-- Statement -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="200" height="100" rx="5" fill="#ffebee" stroke="#c62828" />
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="11" fill="#c62828" font-weight="bold">STATEMENT</text>
    <text x="100" y="55" text-anchor="middle" font-family="Courier New" font-size="14">let x = 5;</text>
    <circle cx="155" cy="52" r="8" fill="none" stroke="#f44336" stroke-width="2" />
    <text x="100" y="85" text-anchor="middle" font-family="Arial" font-size="9" fill="#777">"Hanya menjalankan tugas"</text>
  </g>

  <!-- Expression -->
  <g transform="translate(260, 70)">
    <rect x="0" y="0" width="200" height="100" rx="5" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="11" fill="#2e7d32" font-weight="bold">EXPRESSION</text>
    <text x="100" y="55" text-anchor="middle" font-family="Courier New" font-size="14">x + 1</text>
    <path d="M 160 55 L 190 55" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow-green)" />
    <text x="100" y="85" text-anchor="middle" font-family="Arial" font-size="9" fill="#777">"Menghasilkan nilai (4)"</text>
  </g>

  <text x="250" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#f44336" font-weight="bold">Ada ";" -> Hening | Tanpa ";" -> Bernilai</text>

  <defs>
    <marker id="arrow-green" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e7d32" />
    </marker>
  </defs>
</svg>
