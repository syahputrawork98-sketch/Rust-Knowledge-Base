<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Anatomi Array: let a = [1, 2, 3, 4, 5];</text>

  <!-- Array Box -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="410" height="60" rx="5" fill="#eeeeee" stroke="#999" stroke-width="2" />
    
    <!-- Index 0 -->
    <rect x="5" y="5" width="75" height="50" rx="3" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="42.5" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">1</text>
    <text x="42.5" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#2e7d32">[0]</text>

    <!-- Index 1 -->
    <rect x="85" y="5" width="75" height="50" rx="3" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="122.5" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">2</text>
    <text x="122.5" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#2e7d32">[1]</text>

    <!-- Index 2 -->
    <rect x="165" y="5" width="75" height="50" rx="3" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="202.5" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">3</text>
    <text x="202.5" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#2e7d32">[2]</text>

    <!-- Index 3 -->
    <rect x="245" y="5" width="75" height="50" rx="3" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="282.5" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">4</text>
    <text x="282.5" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#2e7d32">[3]</text>

    <!-- Index 4 -->
    <rect x="325" y="5" width="75" height="50" rx="3" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="362.5" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">5</text>
    <text x="362.5" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#2e7d32">[4]</text>
  </g>

  <rect x="50" y="170" width="400" height="50" rx="5" fill="#ffebee" stroke="#c62828" stroke-dasharray="2,2" />
  <text x="250" y="195" text-anchor="middle" font-family="Arial" font-size="10" fill="#b71c1c" font-weight="bold">Index Out of Bounds: let b = a[10];</text>
  <text x="250" y="210" text-anchor="middle" font-family="Arial" font-size="8" fill="#c62828">💥 RUST WILL PANIC (SAFE SYSTEM)</text>
</svg>
