<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 200">
  <rect x="10" y="10" width="530" height="180" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="275" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Solusi Rust: Mekanisme Move</text>

  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="180" height="110" rx="5" fill="#eee" stroke="#999" stroke-dasharray="5,5" />
    <text x="90" y="20" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">Sebelum Move</text>
    <rect x="20" y="40" width="140" height="40" rx="5" fill="#f96" stroke="#333" />
    <text x="90" y="65" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">👤 s1: AKTIF</text>
  </g>

  <path d="M 210 100 L 250 100" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <g transform="translate(260, 50)">
    <rect x="0" y="0" width="250" height="110" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-dasharray="5,5" />
    <text x="125" y="20" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">Setelah Move</text>
    
    <rect x="10" y="40" width="100" height="40" rx="5" fill="#f5f5f5" stroke="#bdbdbd" />
    <text x="60" y="65" text-anchor="middle" font-family="Arial" font-size="11" fill="#9e9e9e">❌ s1: MATI</text>

    <rect x="120" y="40" width="120" height="40" rx="5" fill="#9f9" stroke="#333" stroke-width="2" />
    <text x="180" y="65" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">👑 s2: PEMILIK</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
