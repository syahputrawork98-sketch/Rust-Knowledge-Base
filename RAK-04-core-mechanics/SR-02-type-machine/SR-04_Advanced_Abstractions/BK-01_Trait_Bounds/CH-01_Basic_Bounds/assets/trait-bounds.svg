<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#343a40">Trait Bounds: The Gatekeeper</text>
  
  <!-- Filter -->
  <rect x="50" y="100" width="300" height="40" rx="20" fill="#343a40"/>
  <rect x="180" y="105" width="40" height="30" fill="white"/> <!-- The Gate -->
  <text x="90" y="125" font-family="Arial" font-size="12" font-weight="bold" fill="white">WHERE T: Display</text>
  
  <!-- Inputs -->
  <circle cx="200" cy="60" r="15" fill="#339af0"/> <!-- Circle fits -->
  <rect x="110" y="50" width="30" height="30" fill="#ced4da"/> <!-- Rect doesn't have display? -->
  <rect x="260" y="50" width="30" height="30" fill="#339af0"/> 
  
  <!-- Allowed -->
  <path d="M 200 140 L 200 200" stroke="#40c057" stroke-width="3" marker-end="url(#green-arrow)"/>
  <circle cx="200" cy="220" r="10" fill="#40c057"/>
  
  <!-- Blocked -->
  <path d="M 125 95 L 80 80" stroke="#fa5252" stroke-width="2" marker-end="url(#red-arrow)"/>
  <text x="50" y="70" font-family="Arial" font-size="10" font-weight="bold" fill="#e03131">REJECTED</text>
  
  <defs>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#40c057" />
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fa5252" />
    </marker>
  </defs>
</svg>
