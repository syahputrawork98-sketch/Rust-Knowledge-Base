<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#343a40">? Operator Short-Circuit</text>
  
  <!-- Function Body -->
  <rect x="50" y="60" width="300" height="180" rx="5" fill="white" stroke="#adb5bd"/>
  
  <!-- Statement 1 -->
  <text x="70" y="90" font-family="Courier New" font-size="12">let x = get_val()?;</text>
  <path d="M 220 90 L 370 90" stroke="#fa5252" stroke-width="2" marker-end="url(#red-arrow)"/>
  <text x="365" y="80" font-family="Arial" font-size="10" fill="#fa5252">Return Err early</text>
  
  <!-- Statement 2 -->
  <text x="70" y="130" font-family="Courier New" font-size="12">let y = process(x)?;</text>
  <path d="M 220 130 L 370 130" stroke="#fa5252" stroke-width="2" marker-end="url(#red-arrow)"/>
  
  <!-- Success -->
  <text x="70" y="170" font-family="Courier New" font-size="12">Ok(y)</text>
  <path d="M 120 170 L 120 270" stroke="#40c057" stroke-width="3" marker-end="url(#green-arrow)"/>
  <text x="130" y="285" font-family="Arial" font-size="12" font-weight="bold" fill="#2f9e44">Final Success</text>
  
  <defs>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fa5252" />
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#40c057" />
    </marker>
  </defs>
</svg>
