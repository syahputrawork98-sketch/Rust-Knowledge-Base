<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fff5f5" stroke="#c62828" stroke-dasharray="5,5" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#b71c1c">Masalah: Potensi Double Free</text>

  <rect x="50" y="60" width="120" height="150" rx="5" fill="#e1f5fe" stroke="#01579b" />
  <text x="110" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Stack</text>
  <rect x="60" y="95" width="100" height="30" rx="3" fill="#fff" stroke="#333" />
  <text x="110" y="115" text-anchor="middle" font-family="Arial" font-size="10">s1: Pointer</text>
  <rect x="60" y="135" width="100" height="30" rx="3" fill="#fff" stroke="#333" />
  <text x="110" y="155" text-anchor="middle" font-family="Arial" font-size="10">s2: Pointer</text>

  <rect x="300" y="90" width="120" height="60" rx="10" fill="#bbf" stroke="#333" />
  <text x="360" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">📦 Data: 'halo'</text>
  <text x="360" y="140" text-anchor="middle" font-family="Arial" font-size="9">(Heap)</text>

  <path d="M 160 110 L 300 110" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 160 150 L 300 130" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <g transform="translate(320, 180)">
    <rect x="0" y="0" width="150" height="40" rx="5" fill="#f00" stroke="#000" />
    <text x="75" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">💥 DOUBLE FREE!</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
    </marker>
  </defs>
</svg>
