<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Cara Kerja Anotasi Lifetime ('a)</text>

  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="120" height="40" rx="5" fill="#e1f5fe" stroke="#01579b" />
    <text x="60" y="25" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Input x: &amp;'a str</text>
    <rect x="25" y="-10" width="70" height="15" rx="3" fill="#01579b" />
    <text x="60" y="2" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Tag 'a</text>
  </g>

  <g transform="translate(180, 60)">
    <rect x="0" y="0" width="120" height="40" rx="5" fill="#e1f5fe" stroke="#01579b" />
    <text x="60" y="25" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Input y: &amp;'a str</text>
    <rect x="25" y="-10" width="70" height="15" rx="3" fill="#01579b" />
    <text x="60" y="2" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Tag 'a</text>
  </g>

  <path d="M 150 80 L 180 80" stroke="#333" stroke-width="1" stroke-dasharray="2,2" />
  <text x="165" y="100" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">Relasi</text>

  <rect x="100" y="130" width="300" height="40" rx="10" fill="#f5f5f5" stroke="#333" stroke-dasharray="5,5" />
  <text x="250" y="155" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic">Compiler: "Keduanya harus hidup minimal sampai 'a berakhir"</text>

  <g transform="translate(190, 190)">
    <rect x="0" y="0" width="120" height="40" rx="5" fill="#9f9" stroke="#333" stroke-width="2" />
    <text x="60" y="25" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Output: &amp;'a str</text>
    <rect x="25" y="-10" width="70" height="15" rx="3" fill="#2e7d32" />
    <text x="60" y="2" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Tag 'a</text>
  </g>

  <path d="M 90 100 L 190 190" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" />
  <path d="M 240 100 L 250 190" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" />

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
