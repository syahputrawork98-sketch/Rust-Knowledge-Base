<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Segitiga Optimasi (--release)</text>

  <rect x="180" y="55" width="140" height="40" rx="20" fill="#eee" stroke="#333" />
  <text x="250" y="80" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">🚀 --release</text>

  <path d="M 250 95 L 250 120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <polygon points="250,120 320,150 250,180 180,150" fill="#f96" stroke="#333" />
  <text x="250" y="155" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">Optimasi</text>

  <g transform="translate(50, 190)">
    <rect x="0" y="0" width="100" height="30" rx="3" fill="#fff9c4" stroke="#fbc02d" />
    <text x="50" y="20" text-anchor="middle" font-family="Arial" font-size="8">Inlining</text>
  </g>

  <g transform="translate(200, 190)">
    <rect x="0" y="0" width="100" height="30" rx="3" fill="#fff9c4" stroke="#fbc02d" />
    <text x="50" y="20" text-anchor="middle" font-family="Arial" font-size="8">Dead Code Removal</text>
  </g>

  <g transform="translate(350, 190)">
    <rect x="0" y="0" width="100" height="30" rx="3" fill="#fff9c4" stroke="#fbc02d" />
    <text x="50" y="20" text-anchor="middle" font-family="Arial" font-size="8">Math Optimization</text>
  </g>

  <path d="M 180 150 L 100 190" stroke="#333" stroke-width="1" stroke-dasharray="2,2" />
  <path d="M 250 180 L 250 190" stroke="#333" stroke-width="1" stroke-dasharray="2,2" />
  <path d="M 320 150 L 400 190" stroke="#333" stroke-width="1" stroke-dasharray="2,2" />

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
