<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <!-- Background -->
  <rect x="0" y="0" width="500" height="300" rx="15" fill="#ffffff" />
  <rect x="10" y="10" width="480" height="280" rx="12" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- Title -->
  <text x="250" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Visualisasi Percabangan If-Else</text>

  <!-- Condition Diamond -->
  <g transform="translate(250, 80)">
    <path d="M 0 -30 L 50 0 L 0 30 L -50 0 Z" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#f57f17">Kondisi (bool)</text>
  </g>

  <!-- Flow Arrows -->
  <!-- True Flow -->
  <path d="M 200 80 L 120 80 L 120 130" fill="none" stroke="#4caf50" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="150" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">true</text>

  <!-- False Flow -->
  <path d="M 300 80 L 380 80 L 380 130" fill="none" stroke="#f44336" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <text x="350" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#c62828">false</text>

  <!-- Action Blocks -->
  <!-- True Block -->
  <g transform="translate(45, 130)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
    <text x="75" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1b5e20">{ Blok If }</text>
  </g>

  <!-- False Block -->
  <g transform="translate(305, 130)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2" />
    <text x="75" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#b71c1c">{ Blok Else }</text>
  </g>

  <!-- Convergence -->
  <path d="M 120 190 L 120 230 L 250 230" fill="none" stroke="#9e9e9e" stroke-width="1.5" />
  <path d="M 380 190 L 380 230 L 250 230" fill="none" stroke="#9e9e9e" stroke-width="1.5" />
  <circle cx="250" cy="230" r="4" fill="#616161" />
  
  <text x="250" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#666">"Alur program bersatu kembali setelah percabangan selesai"</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4caf50" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f44336" />
    </marker>
  </defs>
</svg>
