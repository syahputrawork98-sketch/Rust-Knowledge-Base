<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <rect x="10" y="10" width="480" height="230" rx="10" fill="#fdfdfd" stroke="#333" />
  <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Anatomi Tuple: let tup = (500, 6.4, 1);</text>

  <!-- Tuple Box -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="400" height="100" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2" />
    
    <!-- Index 0 -->
    <rect x="20" y="20" width="100" height="60" rx="5" fill="#e3f2fd" stroke="#1565c0" />
    <text x="70" y="45" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">500</text>
    <text x="70" y="70" text-anchor="middle" font-family="Arial" font-size="9" fill="#1565c0">.0 (i32)</text>

    <!-- Index 1 -->
    <rect x="140" y="20" width="120" height="60" rx="5" fill="#f3e5f5" stroke="#7b1fa2" />
    <text x="200" y="45" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">6.4</text>
    <text x="200" y="70" text-anchor="middle" font-family="Arial" font-size="9" fill="#7b1fa2">.1 (f64)</text>

    <!-- Index 2 -->
    <rect x="280" y="20" width="100" height="60" rx="5" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="330" y="45" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">1</text>
    <text x="330" y="70" text-anchor="middle" font-family="Arial" font-size="9" fill="#2e7d32">.2 (u8)</text>
  </g>

  <rect x="50" y="180" width="400" height="40" rx="5" fill="#fff9c4" stroke="#fbc02d" stroke-dasharray="5,5" />
  <text x="250" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#f57f17">Destructuring: let (x, y, z) = tup;</text>
</svg>
